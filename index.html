<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8dd2b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Receipts" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>Expensify</title>
  </head>
  <body>
    <script>
      (function () {
        var isStandalone =
          (window.matchMedia &&
            window.matchMedia("(display-mode: standalone)").matches) ||
          (window.navigator && window.navigator.standalone === true);

        document.documentElement.classList.add(isStandalone ? "pwa" : "web");

        if (!isStandalone) return;

        // ✅ guard
        if (document.getElementById("boot-splash")) return;

        // ✅ lock layout so nothing scrolls/jumps
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
        document.body.style.height = "100%";

        var splash = document.createElement("div");
        splash.id = "boot-splash";

        // ✅ CRITICAL: make it an overlay BEFORE any CSS loads
        splash.style.cssText = [
          "position:fixed",
          "inset:0",
          "z-index:2147483647",
          "display:grid",
          "place-items:center",
          "background:#f8dd2b",
          "padding-top:env(safe-area-inset-top)",
          "padding-bottom:env(safe-area-inset-bottom)",
        ].join(";");

        splash.innerHTML =
          '<img class="boot-logo" src="/icons/icon-192.png" alt="Rise North" />';

        document.body.appendChild(splash);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
