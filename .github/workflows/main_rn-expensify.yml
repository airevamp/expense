name: Build and deploy Node.js project to Azure Function App - rn-expensify

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Build Project"
        shell: bash
        run: |
          pushd './api'
          npm ci
          npm run build
          popd

      # This step saves the built files so the 'deploy' job can see them
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            ./api
            !./api/**/*.ts
            !./api/tsconfig.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4806B432F93A4E2FABA78ADA2FBCC33A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A2673445C0141348324EC2A8AF6C8D3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D1DC9B20AC564CB189C292C9EA90F297 }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: "rn-expensify"
          slot-name: "Production"
          package: "./api"
          # Since we built the code in GitHub, we disable remote building
          scm-do-build-during-deployment: false
          enable-oryx-build: false
