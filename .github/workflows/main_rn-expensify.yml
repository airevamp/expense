# Docs for the Azure Functions Action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - rn-expensify

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Optional: run tests/lint to fail fast before deploying
      - name: Install dependencies (API)
        shell: bash
        run: |
          pushd './api'
          npm ci
          npm run test --if-present
          popd

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4806B432F93A4E2FABA78ADA2FBCC33A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A2673445C0141348324EC2A8AF6C8D3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D1DC9B20AC564CB189C292C9EA90F297 }}

      - name: Deploy Azure Functions (Oryx build)
        uses: Azure/functions-action@v1
        with:
          app-name: "rn-expensify"
          slot-name: "Production"
          # Deploy the API project root so Azure can restore deps and build.
          package: "./api"
          # Let Kudu/Oryx build during deployment (recommended for Node + TS)
          scm-do-build-during-deployment: true
          enable-oryx-build: true
